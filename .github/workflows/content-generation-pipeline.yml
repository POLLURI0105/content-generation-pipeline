name: Content Generation Pipeline

on:
  schedule:
    - cron: '0 9 * * 1,3,5,0'
  workflow_dispatch:

env:
  RETRY_ATTEMPTS: 3
  RETRY_DELAY: 30

jobs:
  load-ideas:
    name: Load Ideas
    runs-on: ubuntu-latest
    outputs:
      ideas: ${{ steps.load.outputs.ideas }}
    steps:
      - uses: actions/checkout@v4
      - name: Load weekly ideas
        id: load
        run: |
          if [ -f "ideas/weekly_ideas.json" ]; then
            echo "ideas<<EOF" >> $GITHUB_OUTPUT
            cat ideas/weekly_ideas.json >> $GITHUB_OUTPUT
            echo "EOF" >> $GITHUB_OUTPUT
          else
            echo "Error: weekly_ideas.json not found"
            exit 1
          fi

  generate-scripts:
    name: Generate Scripts with Claude
    runs-on: ubuntu-latest
    needs: load-ideas
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: pip install requests python-dotenv anthropic
      - name: Generate scripts from Claude
        env:
          CLAUDE_API_KEY: ${{ secrets.CLAUDE_API_KEY }}
          CLAUDE_PROJECT_ID: ${{ secrets.CLAUDE_PROJECT_ID }}
        run: python scripts/claude_script_generator.py
        continue-on-error: true
      - name: Upload scripts artifact
        uses: actions/upload-artifact@v4
        with:
          name: generated-scripts
          path: output/scripts.json

  voice-cloning:
    name: Voice Cloning with ElevenLabs v3
    runs-on: ubuntu-latest
    needs: generate-scripts
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: pip install requests python-dotenv elevenlabs
      - name: Download scripts artifact
        uses: actions/download-artifact@v4
        with:
          name: generated-scripts
          path: output/
      - name: Generate voice with ElevenLabs v3
        env:
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
          ELEVENLABS_VOICE_ID: ${{ secrets.ELEVENLABS_VOICE_ID }}
          ELEVENLABS_MODEL_ID: eleven_multilingual_v2
        run: python scripts/elevenlabs_voice_generator.py
        continue-on-error: true
      - name: Upload voice artifact
        uses: actions/upload-artifact@v4
        with:
          name: generated-voice
          path: output/

  generate-video-clips:
    name: Generate Video Clips (Kling 3.0 + Veo 3.1)
    runs-on: ubuntu-latest
    needs: generate-scripts
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: pip install requests python-dotenv
      - name: Download scripts artifact
        uses: actions/download-artifact@v4
        with:
          name: generated-scripts
          path: output/
      - name: Generate video with Kling 3.0
        env:
          KLING_API_KEY: ${{ secrets.KLING_API_KEY }}
        run: python scripts/kling_video_generator.py
        continue-on-error: true
      - name: Generate hero shots with Veo 3.1
        env:
          VEO_API_KEY: ${{ secrets.VEO_API_KEY }}
        run: python scripts/veo_hero_shots_generator.py
        continue-on-error: true
      - name: Upload video clips artifact
        uses: actions/upload-artifact@v4
        with:
          name: generated-videos
          path: output/

  generate-images:
    name: Generate Images (Ideogram 3.0 + Midjourney v7)
    runs-on: ubuntu-latest
    needs: generate-scripts
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: pip install requests python-dotenv
      - name: Download scripts artifact
        uses: actions/download-artifact@v4
        with:
          name: generated-scripts
          path: output/
      - name: Generate images with Ideogram 3.0
        env:
          IDEOGRAM_API_KEY: ${{ secrets.IDEOGRAM_API_KEY }}
        run: python scripts/ideogram_image_generator.py
        continue-on-error: true
      - name: Generate images with Midjourney v7
        env:
          MIDJOURNEY_API_KEY: ${{ secrets.MIDJOURNEY_API_KEY }}
        run: python scripts/midjourney_image_generator.py
        continue-on-error: true
      - name: Upload images artifact
        uses: actions/upload-artifact@v4
        with:
          name: generated-images
          path: output/

  fetch-stock-footage:
    name: Fetch Stock B-rolls (Pexels + Pixabay)
    runs-on: ubuntu-latest
    needs: generate-scripts
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: pip install requests python-dotenv
      - name: Download scripts artifact
        uses: actions/download-artifact@v4
        with:
          name: generated-scripts
          path: output/
      - name: Fetch from Pexels
        env:
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
        run: python scripts/pexels_fetcher.py
        continue-on-error: true
      - name: Fetch from Pixabay
        env:
          PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
        run: python scripts/pixabay_fetcher.py
        continue-on-error: true
      - name: Upload stock footage artifact
        uses: actions/upload-artifact@v4
        with:
          name: stock-footage
          path: output/

  generate-sfx-captions:
    name: Generate SFX & Captions
    runs-on: ubuntu-latest
    needs: voice-cloning
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: pip install requests python-dotenv pysrt
      - name: Download voice artifact
        uses: actions/download-artifact@v4
        with:
          name: generated-voice
          path: output/
      - name: Generate SFX with ElevenLabs
        env:
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
        run: python scripts/elevenlabs_sfx_generator.py
        continue-on-error: true
      - name: Fetch SFX from Pixabay
        env:
          PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
        run: python scripts/pixabay_sfx_fetcher.py
        continue-on-error: true
      - name: Generate Captions
        env:
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
        run: python scripts/caption_generator.py
        continue-on-error: true
      - name: Upload SFX and Captions artifact
        uses: actions/upload-artifact@v4
        with:
          name: sfx-captions
          path: output/

  generate-thumbnails:
    name: Generate Thumbnails
    runs-on: ubuntu-latest
    needs: generate-images
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: pip install requests python-dotenv pillow
      - name: Download images artifact
        uses: actions/download-artifact@v4
        with:
          name: generated-images
          path: output/
      - name: Generate thumbnails with Ideogram
        env:
          IDEOGRAM_API_KEY: ${{ secrets.IDEOGRAM_API_KEY }}
        run: python scripts/ideogram_thumbnail_generator.py
        continue-on-error: true
      - name: Generate thumbnails with Canva
        env:
          CANVA_API_KEY: ${{ secrets.CANVA_API_KEY }}
        run: python scripts/canva_thumbnail_generator.py
        continue-on-error: true
      - name: Upload thumbnails artifact
        uses: actions/upload-artifact@v4
        with:
          name: thumbnails
          path: output/

  final-editing:
    name: Final Editing with CapCut
    runs-on: ubuntu-latest
    needs: [generate-video-clips, generate-images, fetch-stock-footage, generate-sfx-captions, generate-thumbnails]
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: pip install requests python-dotenv moviepy
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts/
      - name: Assemble final video
        env:
          CAPCUT_API_KEY: ${{ secrets.CAPCUT_API_KEY }}
        run: python scripts/capcut_editor.py
        continue-on-error: true
      - name: Upload final video artifact
        uses: actions/upload-artifact@v4
        with:
          name: final-content
          path: output/final_videos/

  approval-gate:
    name: Request Deployment Approval
    runs-on: ubuntu-latest
    needs: final-editing
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: pip install requests
      - name: Send approval request email
        env:
          APPROVAL_EMAIL: ${{ secrets.APPROVAL_EMAIL }}
          SMTP_EMAIL: ${{ secrets.SMTP_EMAIL }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          GITHUB_SERVER_URL: ${{ github.server_url }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_RUN_ID: ${{ github.run_id }}
        run: |
          python -c "
          import smtplib
          from email.mime.text import MIMEText
          from email.mime.multipart import MIMEMultipart
          import os

          sender_email = os.getenv('SMTP_EMAIL')
          sender_password = os.getenv('SMTP_PASSWORD')
          receiver_email = os.getenv('APPROVAL_EMAIL')
          run_url = f\"{os.getenv('GITHUB_SERVER_URL')}/{os.getenv('GITHUB_REPOSITORY')}/actions/runs/{os.getenv('GITHUB_RUN_ID')}\"

          subject = '🎬 Spark of AI Pipeline - Approval Required'
          body = f'<html><body><h2>Content ready for deployment!</h2><p><a href=\"{run_url}\">Review and Approve here</a></p></body></html>'

          try:
              msg = MIMEMultipart('alternative')
              msg['Subject'] = subject
              msg['From'] = sender_email
              msg['To'] = receiver_email
              msg.attach(MIMEText(body, 'html'))
              with smtplib.SMTP_SSL('smtp.gmail.com', 465) as server:
                  server.login(sender_email, sender_password)
                  server.sendmail(sender_email, receiver_email, msg.as_string())
              print('Approval email sent!')
          except Exception as e:
              print(f'Email failed: {e}')
          "
      - name: Pause for manual approval
        run: echo "Waiting for approval. Check your email."

  deploy-youtube:
    name: Deploy to YouTube Shorts
    runs-on: ubuntu-latest
    needs: approval-gate
    environment:
      name: production-youtube
      url: https://www.youtube.com/
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: pip install google-auth-oauthlib google-auth-httplib2 google-api-python-client
      - name: Download final videos artifact
        uses: actions/download-artifact@v4
        with:
          name: final-content
          path: output/
      - name: Deploy to YouTube Shorts
        env:
          YOUTUBE_CREDENTIALS: ${{ secrets.YOUTUBE_CREDENTIALS }}
          YOUTUBE_CHANNEL_ID: ${{ secrets.YOUTUBE_CHANNEL_ID }}
        run: python scripts/youtube_uploader.py
        continue-on-error: true

  deploy-instagram:
    name: Deploy to Instagram Reels
    runs-on: ubuntu-latest
    needs: approval-gate
    environment:
      name: production-instagram
      url: https://www.instagram.com/
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: pip install instagrapi requests python-dotenv
      - name: Download final videos artifact
        uses: actions/download-artifact@v4
        with:
          name: final-content
          path: output/
      - name: Deploy to Instagram Reels
        env:
          INSTAGRAM_USERNAME: ${{ secrets.INSTAGRAM_USERNAME }}
          INSTAGRAM_PASSWORD: ${{ secrets.INSTAGRAM_PASSWORD }}
        run: python scripts/instagram_uploader.py
        continue-on-error: true

  notify:
    name: Send Notifications
    runs-on: ubuntu-latest
    needs: [deploy-youtube, deploy-instagram]
    if: always()
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: pip install requests
      - name: Send notifications
        env:
          SLACK_WEBHOOK: ${{ secrets.SLACK_WEBHOOK }}
          NOTIFICATION_EMAIL: ${{ secrets.NOTIFICATION_EMAIL }}
          SMTP_EMAIL: ${{ secrets.SMTP_EMAIL }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
        run: python scripts/notification_handler.py
